version 16.9
no service pad
service tcp-keepalives-in
service timestamps debug datetime show-timezone
service timestamps log datetime show-timezone
service password-encryption
service compress-config
no service call-home
service unsupported-transceiver
no platform punt-keepalive disable-kernel-core
!
hostname S2-AS-527-109-1
!
!
vrf definition Mgmt-vrf
!
address-family ipv4
exit-address-family
!
address-family ipv6
exit-address-family
!
logging buffered 32768
no logging console
enable secret 7 02121D4B0E150A3749400F16171B1B0D09
!
aaa new-model
!
!
aaa authentication login default group tacacs+ local enable
aaa authentication login consoleport group tacacs+ local enable
aaa authentication login no_tacacs line
aaa authentication dot1x default group radius
aaa authorization config-commands
aaa authorization exec default group tacacs+ if-authenticated
aaa authorization exec consoleport group tacacs+ local if-authenticated
aaa authorization commands 1 default local group tacacs+ none
aaa authorization commands 15 default local group tacacs+ none
aaa authorization commands 15 consoleport group tacacs+ local if-authenticated
aaa authorization network default group radius
aaa accounting update newinfo periodic 1440
aaa accounting dot1x default start-stop group radius
aaa accounting exec default start-stop group tacacs+
aaa accounting exec consoleport start-stop group tacacs+
aaa accounting commands 15 default stop-only group tacacs+
aaa accounting commands 15 consoleport start-stop group tacacs+
aaa accounting connection default start-stop group tacacs+
aaa accounting system default start-stop group tacacs+
!
!
!
!
!
aaa server radius dynamic-author
 client <aaa server 1> server-key 7 02121D4B0E150A3749400F16171B1B0D09
 client <aaa server 2> server-key 7 02121D4B0E150A3749400F16171B1B0D09
!
aaa session-id common
clock timezone EST -5 0
clock summer-time EDT recurring
!
!
!
!
call-home
 ! If contact email address in call-home is configured as sch-smart-licensing@cisco.com
 ! the email address configured in Cisco Smart License Portal will be used as contact email address to send SCH notifications.
 contact-email-addr sch-smart-licensing@cisco.com
 profile "CiscoTAC-1"
  active
  destination transport-method http
  no destination transport-method email
no ip source-route
!
!
!
!
!
no ip bootp server
ip name-server 8.8.8.8 8.8.4.4
ip domain name larc.nasa.gov
!
!
!
ip dhcp snooping vlan 1-4094
no ip dhcp snooping information option
no ip dhcp snooping verify mac-address
ip dhcp snooping
login on-success log
!
!
!
!
!
device-sensor accounting
device-sensor notify all-changes
vtp mode transparent
udld enable
epm logging
!
flow record FNF-ETA-REC
 description Stealthwatch Netflow Record
 match datalink mac source address input
 match datalink mac destination address input
 match datalink vlan input
 match ipv4 ttl
 match ipv4 tos
 match ipv4 protocol
 match ipv4 source address
 match ipv4 destination address
 match transport source-port
 match transport destination-port
 match interface input
 collect interface output
 collect counter bytes long
 collect counter packets long
 collect timestamp absolute first
 collect timestamp absolute last
!
!
flow exporter FNF-ETA-EXP
 destination 10.10.10.150
 source Vlan 300
 transport udp 2055
 template data timeout 30
!
!
flow monitor FNF-ETA-MON
 exporter FNF-ETA-EXP
 cache timeout active 60
 record FNF-ETA-REC
!
authentication mac-move permit
!
!
dot1x system-auth-control
!
!
diagnostic bootup level minimal
!
spanning-tree mode rapid-pvst
spanning-tree portfast default
spanning-tree portfast bpduguard default
spanning-tree portfast bpdufilter default
spanning-tree extend system-id
errdisable recovery cause udld
errdisable recovery cause link-flap
errdisable recovery interval 900
!
username roadhouse privilege 15 secret 7 02121D4B0E150A3749400F16171B1B0D09
!
redundancy
 mode sso
!
!
!
!
!
transceiver type all
 monitoring
hw-switch switch 1 logging onboard message
!
vlan 86
 name Disabled
!
vlan 100
 name Voice-10.10.1.0/24
!
vlan 200
 name 10.10.2.0/24
!
vlan 300
 name 10.10.3.0/24
!
class-map match-any system-cpp-police-topology-control
  description Topology control
class-map match-any system-cpp-police-sw-forward
  description Sw forwarding, L2 LVX data, LOGGING
class-map match-any system-cpp-default
  description Inter FED, EWLC control, EWLC data
class-map match-any system-cpp-police-sys-data
  description Learning cache ovfl, High Rate App, Exception, EGR Exception, NFL SAMPLED DATA, RPF Failed
class-map match-any system-cpp-police-punt-webauth
  description Punt Webauth
class-map match-any system-cpp-police-l2lvx-control
  description L2 LVX control packets
class-map match-any system-cpp-police-forus
  description Forus Address resolution and Forus traffic
class-map match-any system-cpp-police-multicast-end-station
  description MCAST END STATION
class-map match-any system-cpp-police-high-rate-app
  description High Rate Applications
class-map match-any system-cpp-police-multicast
  description Transit Traffic and MCAST Data
class-map match-any system-cpp-police-l2-control
  description L2 control
class-map match-any system-cpp-police-dot1x-auth
  description DOT1X Auth
class-map match-all IMPORTANT
 match access-group name QOS_NETMGMT
class-map match-any VIDEO
 match access-group name QOS_STREAMING-VIDEO
class-map match-any system-cpp-police-data
  description ICMP redirect, ICMP_GEN and BROADCAST
class-map match-any system-cpp-police-stackwise-virt-control
  description Stackwise Virtual
class-map match-any non-client-nrt-class
class-map match-any system-cpp-police-routing-control
  description Routing control and Low Latency
class-map match-any system-cpp-police-protocol-snooping
  description Protocol snooping
class-map match-any system-cpp-police-dhcp-snooping
  description DHCP snooping
class-map match-any system-cpp-police-system-critical
  description System Critical and Gold Pkt
!
policy-map system-cpp-policy
